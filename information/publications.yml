publications:
  items:
    - title: "TYPHOON: Transfer Your Packets Hidden Over Observed Networks"
      type: paper
      status: in preparation
      year: 2026
      authors:
        - Aleksandr Sergeev
      venue: "TBD — targeting USENIX Security, IEEE S&P, NDSS, or PoPETs"
      abstract: >-
        Specifies TYPHOON, a UDP-based transport-layer protocol designed to make traffic
        identification impractical. All packets are fully encrypted with no cleartext fields;
        decoy traffic and fake protocol headers mimic generic network behavior. The protocol
        uses a session manager / flow manager architecture, supports multiple proxy endpoints,
        and offers post-quantum readiness via Classic McEliece KEM alongside XChaCha20-Poly1305
        and AES-GCM-256 symmetric modes. Includes a Rust reference implementation.
      link: https://github.com/pseusys/TYPHOON
      profiles:
        - all

  reports:
    - title: Comparison of Neural Network and Algorithmic Based Person Detectors for LiDAR Data
      type: technical report
      status: completed
      year: 2023
      authors:
        - Aleksandr Sergeev
      supervisor: Olivier Aycard
      institution: Grenoble Computer Science Laboratory (LIG), UGA
      abstract: >-
        Compared two person detection methods for 2D LiDAR data: a heuristic cluster-based
        algorithmic detector and a deep learning DROW detector based on 1D convolutional
        architecture. Developed the Follow-the-DROW (FTD) library, ROS package, and Docker
        image for detector comparison and deployment on the RobAIR platform. Identified
        significant annotation quality issues in the DROW dataset affecting evaluation
        reliability; full quantitative comparison was not completed due to computing resource
        constraints.
      link: https://github.com/pseusys/current/tree/master/pr3
      profiles:
        - all

  theses:
    - title: Simulation Framework Code Generation
      degree: Master of Science
      university: Université Grenoble Alpes / Grenoble INP - Ensimag
      year: 2025
      supervisor: Camille Bellot
      company: Ansys (acquired by Synopsys)
      abstract: >-
        Designed and implemented a schema-driven code generation system for Ansys's simulation
        framework (DPF), replacing manually maintained client libraries in Python, C++, and C#
        with auto-generated code from a single schema definition. Evaluated multiple schema
        technologies (FlatBuffers, Protobuf, Cap'n Proto, etc.), designed a front-end/back-end
        generation pipeline with intermediate representation, and integrated the generator
        into existing CMake and Poetry build systems.
      profiles:
        - all
    - title: "Potentially Dangerous to Humans Plant Species Spread Monitoring Software System Developing"
      degree: Bachelor of Technology
      university: St. Petersburg Electrotechnical University (ETU)
      department: Department of Computer Engineering (MOEVM), Faculty KTI
      year: 2022
      supervisor: Mikhail M. Zaslavsky
      abstract: >-
        Developed a monitoring system for Sosnowsky's hogweed (Heracleum sosnowskyi),
        an invasive phototoxic plant species. The system combines a Django/PostGIS server
        backend, a Flutter/BLoC mobile client for field reporting, and a TensorFlow-based
        ML image classification module for species identification. The classifier uses
        MobileNetV2 transfer learning (pretrained on ImageNet) to distinguish three classes
        (hogweed, cetera, other) over a dataset of 7100 images per class sourced from
        OpenImages and iNaturalist, achieving 92% accuracy with 0.4s inference time and
        a 79.3 MB TensorFlow Lite model. The backend uses PostGIS/PostgreSQL for
        geospatial tracking of reported sightings.
      link: https://github.com/pseusys/HogWeedGo
      profiles:
        - all
