projects:
  items:
  - name: TYPHOON
    tools: Rust, UDP, XChaCha20-Poly1305, AES-GCM-256, Classic McEliece, X25519, Ed25519, BLAKE3
    desc: >-
      A novel transport-layer protocol specification and Rust reference implementation designed to resist
      deep packet inspection. Features fully encrypted packets with no cleartext headers, decoy traffic
      generation, fake protocol header mimicry, and multiple cryptographic modes. Paper in preparation.
    link: https://github.com/pseusys/TYPHOON
    start: 2024
    end: Present
    profiles:
      - all
      - research

  - name: Airwire
    tools: Protobuf, X25519, XChaCha20-Poly1305, Firebase, SMS/MMS
    # TODO(airwire-tools): add the implementation language(s) — what is the server
    #   written in? What is the client written in? (e.g., Python, Kotlin, Go, etc.)
    desc: >-
      A hybrid messaging application that switches between web API and SMS/MMS transport.
      Server acts as a stateless relay with no message persistence. Features asynchronous
      encryption for SMS mode, Markov-chain and steganographic encoding for MMS, and
      chunked message delivery over 160-byte SMS constraints.
    link: https://github.com/pseusys/airwire
    start: 2025
    end: Present
    profiles:
      - all
      - research

  - name: SeasideVPN
    tools: Go, Rust, Python, gRPC, Protobuf, Docker
    desc: >-
      A P2P VPN distributed system featuring the TYPHOON protocol, certificate-based authentication,
      traffic obfuscation, and TRON blockchain integration for decentralized provider registration.
    link: https://github.com/pseusys/SeasideVPN
    start: 2022
    end: 2024
    profiles:
      - all
      - research

