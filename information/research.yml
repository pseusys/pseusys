research:
  statements:
    - profiles: [research]
      text: >-
        My research interests span network protocol design, distributed systems, and applied
        cryptography, with a focus on how security and correctness properties can be designed
        into networked systems from first principles. I approach this from both directions:
        building protocols that make strong security guarantees in practice (TYPHOON, a
        privacy-preserving UDP transport; Airwire, a hybrid web/SMS messenger) and reasoning
        formally about correctness under adversarial and uncertain network conditions. For
        doctoral research, I am interested in exploring this boundary more broadly — across
        wireless and IoT protocols, distributed consensus and fault tolerance, robotics and
        autonomous systems, and security analysis at the network and transport layers. I aim
        to work at the intersection of rigorous theoretical foundations and real-world
        protocol engineering.
    - profiles: [cryptography]
      text: >-
        My research focuses on applied cryptography and traffic-analysis-resistant protocols.
        My work on TYPHOON specifies a UDP-based transport that eliminates all cleartext fields,
        integrates post-quantum readiness via Classic McEliece KEM alongside XChaCha20-Poly1305
        and AES-GCM-256, and uses decoy traffic generation to make traffic identification
        economically impractical. I am interested in building formally specified, cryptographically
        rigorous protocols for private peer-to-peer communication, with particular attention to
        post-quantum primitives and their deployment constraints.
    - profiles: [networking]
      text: >-
        My research focuses on network protocol design and traffic-obfuscation infrastructure.
        My work on TYPHOON specifies a UDP-based transport designed to make traffic identification
        impractical by mimicking generic protocol behavior and generating cover traffic. My parallel
        work on Airwire, a hybrid messenger that seamlessly switches between web API and SMS/MMS
        transport, demonstrates interest in resilient communication across heterogeneous networks.
        I aim to contribute to the design of protocols that remain robust against deep packet
        inspection and network-level adversaries.
  keywords:
    - profiles: [research]
      text: "Network protocol design; Distributed systems; Peer-to-peer networks; Applied cryptography; Transport protocols; Wireless and IoT security; Distributed algorithms; Robotics and autonomous systems; Peer-to-peer networks; Traffic analysis; Formal protocol specification"
