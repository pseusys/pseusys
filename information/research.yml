research:
  statements:
    - profiles: [research]
      text: >-
        My research interests span network protocol design, distributed systems, applied cryptography,
        and the broader intersection of systems security and privacy. I am drawn to problems where
        rigorous protocol specification, formal analysis, and practical deployment constraints meet —
        whether that means designing communication systems that resist traffic analysis, building
        resilient peer-to-peer architectures, or exploring privacy-preserving computation and
        post-quantum cryptography. My work on the TYPHOON protocol — a UDP-based transport-layer
        protocol that eliminates all cleartext fields, generates decoy traffic, and mimics generic
        protocol behavior to make traffic identification economically impractical — exemplifies this
        approach. My parallel work on Airwire, a hybrid messenger that seamlessly switches between
        web API and SMS/MMS transport with end-to-end encryption, demonstrates my interest in
        practical secure communication across heterogeneous networks. I am broadly interested in
        collaborating on research that pushes the boundaries of secure, robust, and privacy-respecting
        systems — from transport-layer protocols and distributed algorithms to formal verification
        and applied ML for network security.
    - profiles: [cryptography]
      text: >-
        My research sits at the intersection of applied cryptography and systems security.
        My work on TYPHOON specifies a transport protocol with post-quantum readiness via
        Classic McEliece KEM, XChaCha20-Poly1305 and AES-GCM-256, and decoy-traffic generation
        to make traffic identification economically impractical. Beyond traffic-analysis resistance,
        I am interested in the broader landscape of cryptographic protocol design: privacy-preserving
        computation, formal security proofs, and the practical deployment challenges of post-quantum
        primitives. I welcome research questions at the boundary of cryptographic theory and
        real-world systems — from secure messaging and key exchange to verifiable computation
        and data-privacy infrastructure.
    - profiles: [networking]
      text: >-
        My research focuses on network protocol design, traffic-obfuscation infrastructure, and
        resilient distributed communication. TYPHOON demonstrates my interest in transport-layer
        systems that remain robust against deep packet inspection; Airwire explores hybrid,
        heterogeneous network transports with end-to-end encryption. More broadly, I am interested
        in the design and analysis of distributed systems — from consensus protocols and edge
        computing architectures to network observability, IoT communication, and ML-assisted
        traffic analysis. I am open to research directions that combine rigorous systems thinking
        with security or privacy goals.
  keywords:
    - profiles: [research]
      text: "Network protocol design; Distributed systems; Applied cryptography; Traffic analysis resistance; Traffic obfuscation; Secure messaging; Post-quantum cryptography; Privacy-preserving computation; Peer-to-peer networks; Formal protocol verification; Edge computing; Network observability; Hybrid transport systems; ML for network security"
