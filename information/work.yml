      place: Synopsys (formerly Ansys) - Lyon, France
      resp: Continuing development of schema-driven code generation system for the DPF simulation framework. The system follows traditional compiler architecture with front-end parsing, intermediate representation, and back-end code emission targeting FlatBuffers format.
      start: Sept '25
      end: Present
      profiles:
        - research

    - job: Research and Development Engineer
      place: Synopsys (formerly Ansys) - Lyon, France
      resp: |
        + Changed the physical simulation data representation and its API, focusing on processing and transmission speed.
        + Enhanced user library by providing copy-less and allocation-less access to raw FlatBuffers-based data using generated code in C++, Python and C#.
        + User interface became more friendly, efficient and more consistent with the well-defined schemas, used as the source of truth.
      start: Sept '25
      end: Present
      profiles:
        - frontend
        - backend
        - devops

