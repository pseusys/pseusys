      resp: "Master's thesis internship: designed and implemented a multi-language code generation pipeline for the DPF simulation framework, replacing manually maintained client libraries in Python, C++, and C# with auto-generated code from schema definitions."
      start: Feb '25
      end: Aug '25
      profiles:
        - research

    - job: Backend Developing Intern
      place: Ansys (acquired by Synopsys) - Lyon, France
      resp: |
        + Was part of a team responsible for data storage and transfer optimization between different parts of [AnsysDPF](https://dpf.docs.pyansys.com) infrastructure.
        + Proposed and implemented in Python a code generation design; internal data structures have been wrapped with consistent and schema-based generated user interfaces (in Python, C++ and C#).
