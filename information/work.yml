    # --- LIGLAB ---
    - job: Research Intern
      place: Grenoble Computer Science Laboratory (LIG), UGA
      resp: Compared neural network (DROW) and algorithmic person detectors for 2D LiDAR data on the RobAIR platform. Developed the FTD comparison library, ROS package, and Docker deployment image.
      start: Jun '23
      end: Aug '23
      profiles:
        - research

    - job: Research Intern
      place: Grenoble Computer Science Laboratory (LIG), UGA
      resp: |
        + Explored the possibility of replacing the algorithm-based navigation mechanism used in laboratory robots equipped with 2D LiDARs with a machine-learning-based one.
        + Developed C++ and Python interfaces for RobotOS, allowing different navigation algorithms to be integrated, and compared them both physically and in simulation.
        + Even though trained neural networks didn't outperform existing algorithms (primarily due to annotation issues in LiDAR records used for training), the developed interfaces are still used in further research.
      start: Jun '23
      end: Aug '23
